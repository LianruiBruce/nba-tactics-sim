<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>回合回放</title>
<style>
:root{
  --bg:#f4f6f3; --panel:#ffffff; --ink:#1c2733; --muted:#5d6b78; --line:#d5dbd6;
  --off:#1f5fbf; --def:#c4372c; --floor:#efe6d6; --paint:#e6d6bb; --ball:#e07a1f;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161c1a; --panel:#1e2623; --ink:#e6ebe5; --muted:#9aa8a1; --line:#33403b;
  --off:#6ea3ff; --def:#ff7a6b; --floor:#2a2620; --paint:#3a3226; --ball:#ff9a3c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161c1a; --panel:#1e2623; --ink:#e6ebe5; --muted:#9aa8a1; --line:#33403b;
  --off:#6ea3ff; --def:#ff7a6b; --floor:#2a2620; --paint:#3a3226; --ball:#ff9a3c; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline;margin-bottom:12px}
h1{font-size:20px;margin:0}
.hint{color:var(--muted);font-size:13px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
@media (max-width:820px){.main{grid-template-columns:1fr}}
.stage{min-width:0}
canvas{width:100%;height:auto;display:block;border-radius:6px;background:var(--floor)}
.hud{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:13px;margin:10px 0 6px}
.hud b{font-size:18px}
.sc{color:var(--def)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font:inherit;padding:5px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--off);outline-offset:2px}
input[type=range]{flex:1;min-width:160px}
aside{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;max-height:620px;overflow:auto}
aside h2{font-size:14px;margin:0 0 8px}
.ev{display:grid;grid-template-columns:44px 1fr;gap:6px;padding:3px 0;color:var(--muted);font-size:13px;cursor:pointer}
.ev .t{font-family:var(--mono)}
.ev.past{color:var(--ink)}
.ev.now{font-weight:600}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px;margin-top:12px}
.roster .o{color:var(--off)} .roster .d{color:var(--def)}
.outcome{margin-top:6px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>回合回放</h1>
    <span class="hint" id="src">读取 replays/sample.json，或选择本地回放文件</span>
    <input type="file" id="file" accept=".json,application/json">
  </header>
  <div class="main">
    <div class="stage">
      <canvas id="cv" width="1000" height="940" aria-label="半场俯视回放"></canvas>
      <div class="hud">
        <span id="teams"></span>
        <span>24 秒 <b class="sc" id="shot">24.0</b></span>
        <span>时间 <b id="gclock">12:00</b></span>
        <span>t=<span id="tt">0.0</span>s</span>
      </div>
      <div class="controls">
        <select id="poss" aria-label="选择回合"></select>
        <button id="play">播放</button>
        <select id="speed" aria-label="播放速度">
          <option value="0.5">0.5×</option><option value="1" selected>1×</option>
          <option value="2">2×</option><option value="4">4×</option>
        </select>
        <input type="range" id="seek" min="0" max="0" step="0.01" value="0" aria-label="时间轴">
      </div>
    </div>
    <aside>
      <h2>事件</h2>
      <div id="events"></div>
      <div class="outcome" id="outcome"></div>
      <div class="roster" id="roster"></div>
    </aside>
  </div>
</div>
<script>
(function(){
  const S = 20;                 // canvas px per foot
  const W = 50, H = 47;
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  let data = null, poss = null, t = 0, playing = false, last = null;

  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const OUTCOME = {made_shot:'投篮命中', defensive_rebound:'防守篮板', turnover:'失误',
                   shot_clock_violation:'24 秒违例', end_of_period:'节末'};
  const ZONE = {rim:'篮下', paint:'禁区', mid:'中距离', corner3:'底角三分', above3:'弧顶/45°三分'};

  function nameOf(i){ const p = poss.meta.players[i]; return p ? p.name.split(' ').slice(-1)[0] : '?'; }
  function describe(e){
    switch(e.type){
      case 'pass': return `${nameOf(e.by)} 传球给 ${nameOf(e.to)}`;
      case 'catch': return `${nameOf(e.by)} 接球`;
      case 'shot': return `${nameOf(e.by)} ${ZONE[e.zone]||e.zone}出手（命中率 ${(e.p*100).toFixed(0)}%）`;
      case 'score': return `命中 +${e.pts}`;
      case 'miss': return `${nameOf(e.by)} 投篮不中`;
      case 'rebound': return `${nameOf(e.by)} ${e.offensive?'进攻':'防守'}篮板`;
      case 'steal': return `${nameOf(e.by)} 抢断`;
      case 'violation': return '24 秒违例';
      case 'end': return `回合结束：${OUTCOME[e.outcome]||e.outcome}，${e.points} 分`;
      default: return e.type;
    }
  }

  function load(d, label){
    data = d;
    const sel = $('poss'); sel.innerHTML = '';
    d.possessions.forEach((p,k)=>{
      const o = document.createElement('option');
      o.value = k; o.textContent = `回合 ${k+1}：${p.meta.offense} 进攻`;
      sel.appendChild(o);
    });
    if (label) $('src').textContent = label;
    pick(0);
  }

  function pick(k){
    poss = data.possessions[k]; t = 0; playing = false; $('play').textContent = '播放';
    const end = poss.frames[poss.frames.length-1].t;
    $('seek').max = end; $('seek').value = 0;
    $('teams').textContent = `${poss.meta.offense} 进攻 · ${poss.meta.defense} 防守`;
    $('outcome').textContent = `结果：${OUTCOME[poss.outcome]||poss.outcome}，${poss.points} 分`;
    const ev = $('events'); ev.innerHTML = '';
    poss.events.forEach(e=>{
      const row = document.createElement('div'); row.className = 'ev'; row.dataset.t = e.t;
      row.innerHTML = `<span class="t">${e.t.toFixed(1)}</span><span></span>`;
      row.lastChild.textContent = describe(e);
      row.onclick = () => { t = e.t; draw(); };
      ev.appendChild(row);
    });
    const r = $('roster'); r.innerHTML = '';
    poss.meta.players.forEach(p=>{
      const s = document.createElement('div'); s.className = p.team==='offense'?'o':'d';
      s.textContent = `${p.pos} ${p.name}`; r.appendChild(s);
    });
    draw();
  }

  function frameAt(tt){
    const fr = poss.frames, dt = poss.meta.dt;
    const i = Math.max(0, Math.min(fr.length-1, Math.floor(tt/dt + 1e-6)));
    const j = Math.min(fr.length-1, i+1);
    const a = fr[i], b = fr[j];
    const u = j===i ? 0 : Math.max(0, Math.min(1, (tt - a.t)/(b.t - a.t || dt)));
    const lerp = (x,y)=>x+(y-x)*u;
    return {
      sc: lerp(a.sc,b.sc), gc: lerp(a.gc,b.gc), holder: a.holder,
      ball: a.ball.map((v,k)=>lerp(v,b.ball[k])),
      p: a.p.map((q,k)=>[lerp(q[0],b.p[k][0]), lerp(q[1],b.p[k][1])])
    };
  }

  function court(){
    const ink = css('--ink');
    ctx.fillStyle = css('--floor'); ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle = css('--paint'); ctx.fillRect(17*S, 0, 16*S, 19*S);
    ctx.strokeStyle = ink; ctx.globalAlpha = .55; ctx.lineWidth = 2;
    ctx.strokeRect(1,1,W*S-2,H*S-2);
    ctx.strokeRect(17*S, 0, 16*S, 19*S);
    ctx.beginPath(); ctx.arc(25*S, 19*S, 6*S, 0, Math.PI*2); ctx.stroke();
    const by = 5.25*S, R = 23.75*S;
    const breakY = 5.25 + Math.sqrt(23.75**2 - 22**2);
    const ang = Math.atan2((breakY-5.25)*S, 22*S);
    ctx.beginPath(); ctx.moveTo(3*S,0); ctx.lineTo(3*S, breakY*S);
    ctx.arc(25*S, by, R, Math.PI-ang, ang, true); ctx.lineTo(47*S,0); ctx.stroke();
    ctx.beginPath(); ctx.arc(25*S, by, 4*S, Math.PI, 0, true); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(22*S, 4*S); ctx.lineTo(28*S, 4*S); ctx.stroke();
    ctx.beginPath(); ctx.arc(25*S, H*S, 6*S, Math.PI, 0); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = css('--ball'); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(25*S, by, 0.75*S, 0, Math.PI*2); ctx.stroke();
  }

  function draw(){
    if (!poss) return;
    const f = frameAt(t);
    court();
    const off = css('--off'), def = css('--def'), panel = css('--panel');
    f.p.forEach((q,i)=>{
      const pl = poss.meta.players[i], isOff = pl.team==='offense';
      const x = q[0]*S, y = q[1]*S;
      ctx.beginPath(); ctx.arc(x, y, 1.25*S, 0, Math.PI*2);
      ctx.fillStyle = isOff ? panel : def; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = isOff ? off : def; ctx.stroke();
      ctx.fillStyle = isOff ? off : panel;
      ctx.font = 'bold 14px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(pl.pos, x, y);
      ctx.fillStyle = isOff ? off : def; ctx.font = '13px system-ui';
      ctx.fillText(nameOf(i), x, y + 1.25*S + 11);
      if (f.holder === i){ ctx.beginPath(); ctx.arc(x, y, 1.25*S+5, 0, Math.PI*2);
        ctx.strokeStyle = css('--ball'); ctx.lineWidth = 2; ctx.stroke(); }
    });
    const [bx,by,bz] = f.ball, r = 0.45*S*(1 + (bz-3.5)/14);
    ctx.globalAlpha = .25; ctx.fillStyle = css('--ink');
    ctx.beginPath(); ctx.ellipse(bx*S, by*S, 0.45*S, 0.3*S, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = css('--ball');
    ctx.beginPath(); ctx.arc(bx*S, by*S - (bz-3.5)*4, r, 0, Math.PI*2); ctx.fill();

    $('shot').textContent = f.sc.toFixed(1);
    const m = Math.floor(f.gc/60), s = (f.gc%60).toFixed(1).padStart(4,'0');
    $('gclock').textContent = `${m}:${s}`;
    $('tt').textContent = t.toFixed(1);
    $('seek').value = t;
    document.querySelectorAll('.ev').forEach(el=>{
      const et = +el.dataset.t;
      el.classList.toggle('past', et <= t + 1e-6);
      el.classList.toggle('now', et <= t + 1e-6 && et > t - 0.6);
    });
  }

  function tick(ts){
    if (playing && poss){
      if (last != null) t += (ts - last)/1000 * +$('speed').value;
      const end = poss.frames[poss.frames.length-1].t;
      if (t >= end){ t = end; playing = false; $('play').textContent = '播放'; }
      draw();
    }
    last = ts; requestAnimationFrame(tick);
  }

  $('play').onclick = () => {
    if (!poss) return;
    const end = poss.frames[poss.frames.length-1].t;
    if (t >= end) t = 0;
    playing = !playing; $('play').textContent = playing ? '暂停' : '播放';
  };
  $('seek').oninput = e => { t = +e.target.value; draw(); };
  $('poss').onchange = e => pick(+e.target.value);
  $('file').onchange = e => {
    const fl = e.target.files[0]; if (!fl) return;
    fl.text().then(txt => load(JSON.parse(txt), fl.name));
  };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);

  if (window.REPLAY) load(window.REPLAY, '内置示例回放');
  else fetch('../replays/sample.json').then(r => r.ok ? r.json() : Promise.reject())
    .then(d => load(d, 'replays/sample.json')).catch(()=>{});
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
